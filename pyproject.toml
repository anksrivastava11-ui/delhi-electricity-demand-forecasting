[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "electricity-forecasting"
version = "0.1.0"
description = "Modular daily electricity-demand forecasting"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
  "PyYAML>=6.0",
  "openpyxl>=3.1",
  "matplotlib>=3.7",
  "scipy>=1.10",
]

[project.optional-dependencies]
boosting = ["xgboost>=2.0", "lightgbm>=4.0"]
prophet = ["prophet>=1.1"]
deep-learning = ["torch>=2.1"]
shap = ["shap>=0.44"]
dev = ["pytest>=8.0"]

[project.scripts]
electricity-forecast = "electricity_forecasting.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
